name: 🚀 Deploy Bell-API to Proxmox (Docker)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g., v0.6.0 or latest)"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy on Proxmox VM
    runs-on: [self-hosted, proxmox]

    steps:
      - name: 🔍 Resolve deployment tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "Deploying from release: $TAG"
          else
            TAG="${{ github.event.inputs.tag }}"
            echo "Deploying manually specified tag: $TAG"
          fi

          TAG_NO_V="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag-no-v=$TAG_NO_V" >> "$GITHUB_OUTPUT"

      - name: 🚀 Run deploy script
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag-no-v }}
        run: |
          echo "Deploying GamerBell with tag: ${IMAGE_TAG}"
          /opt/fitznet/scripts/deploy-gamerbell.sh "${IMAGE_TAG}"
