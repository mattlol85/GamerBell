# Development profile - extends application.properties
# Adds localhost:3000 to CORS so the Vite dev server can talk directly to GamerBell
# when the proxy is bypassed (e.g. integration testing outside Vite).
cors.allowed-origins=https://fitznet.org,https://www.fitznet.org,https://fitznet.doomdns.org,https://api.fitznet.doomdns.org,https://gamerbell.fitznet.doomdns.org,https://gamerbell.fitznet.org,http://localhost:3000

management.endpoints.web.cors.allowed-origins=${cors.allowed-origins}

logging.level.org.fitznet.fun=DEBUG
logging.level.org.springframework.web=DEBUG

