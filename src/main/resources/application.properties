spring.application.name=GamerBell

# Management endpoints - prometheus is scraped over the internal Docker network;
# loggers/logfile are intentionally not exposed (loggers accepts POSTs to mutate
# log levels and this app has no authentication layer)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read-only
management.endpoint.health.probes.enabled=true

# Info endpoint configuration - /actuator/info is internet-facing, so keep it to
# build info only (the status dashboard reads the version); no env/os/java recon data
management.info.git.mode=simple
management.info.build.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false

# Logging Configuration for Loki
logging.level.root=INFO
logging.level.org.fitznet.fun=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.websocket=INFO
logging.level.org.springframework.boot.web=INFO

# Enable structured logging (JSON for production)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Firmware Update Configuration
firmware.github.repo=${FIRMWARE_GITHUB_REPO:mattlol85/Esp32FitznetBell}
firmware.storage.path=${FIRMWARE_STORAGE_PATH:./firmware}
firmware.filename=${FIRMWARE_FILENAME:firmware.bin}

# WebSocket device authentication - shared secret validated on the /ws handshake
# (DeviceAuthHandshakeInterceptor). The token may be sent as the X-GamerBell-Token
# header (ESP32 firmware) or as the ?token= query parameter (browsers, which cannot
# set custom handshake headers). Disabled by default for backwards compatibility.
gamerbell.ws.auth.enabled=${GAMERBELL_WS_AUTH_ENABLED:false}
gamerbell.ws.auth.token=${GAMERBELL_WS_TOKEN:}
gamerbell.ws.auth.header-name=${GAMERBELL_WS_HEADER_NAME:X-GamerBell-Token}
gamerbell.ws.auth.query-param=${GAMERBELL_WS_QUERY_PARAM:token}

# CORS allowed origins (override in application-dev.properties to add localhost)
cors.allowed-origins=https://fitznet.org,https://www.fitznet.org,https://fitznet.doomdns.org,https://api.fitznet.doomdns.org,https://gamerbell.fitznet.doomdns.org,https://gamerbell.fitznet.org

# CORS for actuator endpoints (browser dashboards)
management.endpoints.web.cors.allowed-origins=${cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.exposed-headers=Authorization,Content-Type
management.endpoints.web.cors.allow-credentials=true
management.endpoints.web.cors.max-age=3600

# Server Configuration
server.port=${SERVER_PORT:8080}
